services:
  app:
    build: .
    command: sh -c "npm run db:migrate && npm run start"
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://poster:poster@db:5432/bluesky_poster
      DASHBOARD_ADMIN_USER: ${DASHBOARD_ADMIN_USER:-admin}
      DASHBOARD_ADMIN_PASSWORD: ${DASHBOARD_ADMIN_PASSWORD:-change-me}
      DRY_RUN: ${DRY_RUN:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../inferenco-web-app
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_POSTER_API_URL: ${VITE_POSTER_API_URL:-http://app:3000}
    depends_on:
      app:
        condition: service_started
    profiles:
      - web

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bluesky_poster
      POSTGRES_USER: poster
      POSTGRES_PASSWORD: poster
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poster -d bluesky_poster"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
