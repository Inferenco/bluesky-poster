name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node -e "const p=require('./package.json'); const l=require('./package-lock.json'); console.log({ packageEsbuild:p.devDependencies.esbuild, lockRootEsbuild:l.packages[''].devDependencies.esbuild, lockEsbuild:l.packages['node_modules/esbuild']?.version })"
      - run: npm install
      - run: npm run lint
      - run: npm run test
      - run: npm run build
