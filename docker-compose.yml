services:
  app:
    build: .
    command: sh -c "npm run db:migrate && npm run start"
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://poster:poster@db:5432/bluesky_poster
      DASHBOARD_ADMIN_USER: ${DASHBOARD_ADMIN_USER:-admin}
      DASHBOARD_ADMIN_PASSWORD: ${DASHBOARD_ADMIN_PASSWORD:-change-me}
      DRY_RUN: ${DRY_RUN:-true}
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bluesky_poster
      POSTGRES_USER: poster
      POSTGRES_PASSWORD: poster
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
